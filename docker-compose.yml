version: "3.8"

services:
  db:
    image: mysql:latest
    container_name: Warehouse_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: Warehouse_torsten
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: